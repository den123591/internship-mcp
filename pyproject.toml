[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-mcp"
version = "0.1.0"
description = "MCP-сервер для AI-агентов: поиск IT-стажировок, аналитика рынка и разбор резюме"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daniil Terpogosov" }]
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "internship-radar @ git+https://github.com/den123591/internship-radar@main",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[project.scripts]
internship-mcp = "internship_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
